name: Build ejecutables

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # necesario para que el job "release" pueda crear la GitHub Release

jobs:
  tests:
    # Si estas pruebas fallan, no se compila ni se publica nada: los clientes de un usuario
    # nunca deben cambiar de estado solos al abrir/actualizar la app (ver tests/test_estados.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Pillow (lo usan las pruebas del OCR)
        run: pip install pillow
      - name: Pruebas de regresión (estados de clientes y config del OCR)
        run: python -m unittest discover -s tests -v
      - name: La versión del código tiene que coincidir con el tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(python -c "import version; print(version.__version__)")
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then
            echo "version.py dice $V pero el tag es ${GITHUB_REF_NAME}"; exit 1
          fi

  build-windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Tesseract-OCR (para empaquetarlo dentro del .exe)
        shell: pwsh
        run: choco install tesseract -y --no-progress
      - name: Asegurar idiomas de Tesseract (inglés + español)
        shell: pwsh
        run: |
          # No asumimos que el paquete de Chocolatey trae ningún idioma incluido (en algunos
          # runners no trae ni siquiera "eng", el default de Tesseract si no se pide "spa"
          # explícitamente) — se descargan los dos siempre que falten, desde la misma fuente
          # (tessdata_fast, compatible con la versión de Tesseract que instala choco).
          $tessdata = "C:\Program Files\Tesseract-OCR\tessdata"
          foreach ($idioma in "eng", "spa") {
            if (-not (Test-Path "$tessdata\$idioma.traineddata")) {
              Invoke-WebRequest `
                -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$idioma.traineddata" `
                -OutFile "$tessdata\$idioma.traineddata"
            }
          }
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Generar .exe (con Tesseract empaquetado adentro)
        run: >-
          pyinstaller --onefile --windowed --name GestorClientes
          --add-data "C:\Program Files\Tesseract-OCR;tesseract"
          main.py
      - uses: actions/upload-artifact@v4
        with:
          name: GestorClientes-windows
          path: dist/GestorClientes.exe

  build-linux:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Tkinter y dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          pip install -r requirements.txt
      - name: Generar binario
        run: pyinstaller --onefile --name GestorClientes main.py
      - uses: actions/upload-artifact@v4
        with:
          name: GestorClientes-linux
          path: dist/GestorClientes

  release:
    # Solo corre cuando el push fue un tag vX.Y.Z (no en cada push a main). Crea la GitHub
    # Release y le adjunta el .exe — esto es lo que updater.py va a consultar para saber si
    # hay una versión nueva disponible.
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GestorClientes-windows
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/GestorClientes.exe
          generate_release_notes: true

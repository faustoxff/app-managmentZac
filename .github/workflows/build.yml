name: Build ejecutables

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # necesario para que el job "release" pueda crear la GitHub Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Tesseract-OCR (para empaquetarlo dentro del .exe)
        shell: pwsh
        run: choco install tesseract -y --no-progress
      - name: Agregar idioma español a Tesseract
        shell: pwsh
        run: |
          $tessdata = "C:\Program Files\Tesseract-OCR\tessdata"
          if (-not (Test-Path "$tessdata\spa.traineddata")) {
            Invoke-WebRequest `
              -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/spa.traineddata" `
              -OutFile "$tessdata\spa.traineddata"
          }
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Generar .exe (con Tesseract empaquetado adentro)
        run: >-
          pyinstaller --onefile --windowed --name GestorClientes
          --add-data "C:\Program Files\Tesseract-OCR;tesseract"
          main.py
      - uses: actions/upload-artifact@v4
        with:
          name: GestorClientes-windows
          path: dist/GestorClientes.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Tkinter y dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          pip install -r requirements.txt
      - name: Generar binario
        run: pyinstaller --onefile --name GestorClientes main.py
      - uses: actions/upload-artifact@v4
        with:
          name: GestorClientes-linux
          path: dist/GestorClientes

  release:
    # Solo corre cuando el push fue un tag vX.Y.Z (no en cada push a main). Crea la GitHub
    # Release y le adjunta el .exe — esto es lo que updater.py va a consultar para saber si
    # hay una versión nueva disponible.
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GestorClientes-windows
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/GestorClientes.exe
          generate_release_notes: true
